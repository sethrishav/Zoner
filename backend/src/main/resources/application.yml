spring:
  application:
    name: zoner
  profiles:
    active: dev            # overridden by SPRING_PROFILES_ACTIVE (e.g. prod)
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 20000   # tolerate a sleeping (scale-to-zero) database waking up
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only verifies it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC          # instants are stored and read as UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
      path-mapping:
        health: healthz           # /healthz (with DB), /healthz/liveness (no DB), /healthz/readiness
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
