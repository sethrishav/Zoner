services:
  # ==============================================================================
  # 1. Zoner Backend Web Service (Spring Boot 3.5.6 / Java 21 / Docker)
  # ==============================================================================
  - type: web
    name: zoner-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: DB_URL
        value: jdbc:postgresql://ep-withered-pond-azsfhv1h-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - key: DB_USER
        value: neondb_owner
      - key: DB_PASSWORD
        sync: false # Render will prompt for the DB password in the dashboard UI
      - key: DB_POOL_SIZE
        value: "5"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,https://*.onrender.com"
      - key: PORT
        value: "8080"

  # ==============================================================================
  # 2. Zoner Frontend Static Site (React 18 / Vite SPA)
  # ==============================================================================
  - type: web
    name: zoner-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: zoner-backend
          property: host
      - key: VITE_MCP_SERVER_URL
        fromService:
          type: web
          name: zoner-backend
          property: host
